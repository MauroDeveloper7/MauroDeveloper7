<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="100%" role="img" aria-label="GitHub Contribution Snake">
  <style>
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    @keyframes moveSnake {
      0% { transform: translateX(0px); }
      50% { transform: translateX(620px); }
      100% { transform: translateX(0px); }
    }
    .snake-bar { animation: moveSnake 7s ease-in-out infinite; }
  </style>
  <rect x="1" y="1" width="878" height="128" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" />
  <text x="24" y="32" fill="#57606a" font-size="12.5" class="mono">$ gh-snake --sync-contributions --status=ready</text>
  <text x="24" y="56" fill="#1a7f37" font-size="12.5" class="mono">&gt; Al subir este repositorio a GitHub, GitHub Actions generará aquí tu serpiente real de commits automáticamente.</text>
  <g transform="translate(24, 76)">
    <rect x="0" y="0" width="832" height="28" rx="6" fill="#ffffff" stroke="#d0d7de" />
    <g class="snake-bar">
      <rect x="12" y="7" width="14" height="14" rx="3" fill="#9be9a8" />
      <rect x="30" y="7" width="14" height="14" rx="3" fill="#40c463" />
      <rect x="48" y="7" width="14" height="14" rx="3" fill="#30a14e" />
      <rect x="66" y="7" width="14" height="14" rx="3" fill="#216e39" />
      <rect x="84" y="7" width="14" height="14" rx="3" fill="#1a7f37" />
    </g>
  </g>
</svg>
